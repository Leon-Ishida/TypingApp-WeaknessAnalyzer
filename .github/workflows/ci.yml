name: TypingApp CI

on: [push]

jobs:
  build: 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build with Maven
      run: mvn clean test