<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypingApp — 弱点練習</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="practice.css" />
</head>
<body>
<div id="app">

  <!-- ─── MODE SELECT SCREEN ─── -->
  <div id="screen-select" class="screen active">
    <div class="card">
      <p class="logo">Typing<span>App</span></p>
      <p class="tagline">弱点練習モード</p>

      <div id="select-error" class="practice-error"></div>

      <div class="mode-grid">
        <div class="mode-card" id="mode-weakness">
          <p class="mode-title">傾向ベース練習</p>
          <p class="mode-desc">ミスのパターン（置換・交換・削除・挿入）の傾向を含んだ単語を練習します</p>
        </div>
        <div class="mode-card" id="mode-frequent">
          <p class="mode-title">頻度ベース練習</p>
          <p class="mode-desc">直近のテストで最も多くミスした単語を集中的に練習します</p>
        </div>
      </div>

      <div class="result-actions" style="justify-content:center">
        <a href="weakness.html" class="btn btn-secondary">← 弱点分析に戻る</a>
      </div>
    </div>
  </div>

  <!-- ─── PRACTICE TEST SCREEN ─── -->
  <div id="screen-practice" class="screen">
    <div class="test-header">
      <span class="label" id="progress-label">0 / 10</span>
      <span class="label" id="mode-label"></span>
      <span class="label" id="elapsed-label">00:00</span>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <div class="card">
      <p class="word-display" id="word-display"></p>

      <div class="input-wrap">
        <input
          type="text"
          id="typing-input"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="ここに入力..."
          onkeydown="handleKeydown(event)"
        />
      </div>
      <p class="hint">Enter で次の問題へ</p>
    </div>
  </div>

  <!-- ─── PRACTICE RESULT SCREEN ─── -->
  <div id="screen-result" class="screen">
    <div class="card">
      <p class="result-headline label">// 練習結果</p>

      <div class="stat-row">
        <div class="stat-cell">
          <span class="stat-num" id="result-wpm">--</span>
          <span class="stat-unit">WPM</span>
          <p class="label" style="margin-top:.25rem">ネット WPM</p>
        </div>
        <div class="stat-cell">
          <span class="stat-num" id="result-acc">--</span>
          <span class="stat-unit">%</span>
          <p class="label" style="margin-top:.25rem">正答率</p>
        </div>
      </div>

      <p class="label word-table-title">単語ごとの結果</p>
      <table class="word-table">
        <thead>
          <tr>
            <th>問題</th>
            <th>解答</th>
            <th>判定</th>
            <th>ミスの詳細</th>
          </tr>
        </thead>
        <tbody id="result-tbody"></tbody>
      </table>

      <div class="result-actions">
        <a href="practice.html" class="btn btn-secondary">モード選択に戻る</a>
        <a href="index.html" class="btn btn-secondary">通常テストへ</a>
      </div>
    </div>
  </div>

</div>
<script src="practice.js"></script>
</body>
</html>
