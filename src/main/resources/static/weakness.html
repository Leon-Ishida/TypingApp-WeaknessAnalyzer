<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypingApp — 弱点分析</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="weakness.css" />
</head>
<body>
<div id="app">

  <div id="screen-weakness" class="screen active">
    <div class="card">
      <p class="result-headline label">// 弱点分析</p>

      <div id="weakness-error" class="weakness-error"></div>
      <div id="weakness-loading" class="weakness-loading">
        <span class="spinner"></span>分析中...
      </div>

      <div id="weakness-content" style="display:none">

        <!-- 置換ミス -->
        <div class="weakness-section">
          <p class="weakness-section-title label">置換ミス</p>
          <p class="weakness-section-desc">打つべきキーの代わりに別のキーを押してしまうミス</p>
          <p class="weakness-example">例: <code>hello</code> → <code>h<span class="ex-wrong">i</span>llo</code>（e を i と打ち間違い）</p>
          <div id="sub-list" class="weakness-list"></div>
        </div>

        <!-- 交換ミス -->
        <div class="weakness-section">
          <p class="weakness-section-title label">交換ミス</p>
          <p class="weakness-section-desc">隣り合う2つのキーの入力順序が入れ替わるミス</p>
          <p class="weakness-example">例: <code>hello</code> → <code>h<span class="ex-wrong">le</span>lo</code>（e と l の順序が逆）</p>
          <div id="trans-list" class="weakness-list"></div>
        </div>

        <!-- 削除ミス -->
        <div class="weakness-section">
          <p class="weakness-section-title label">削除ミス</p>
          <p class="weakness-section-desc">打つべきキーを打ち忘れてしまうミス</p>
          <p class="weakness-example">例: <code>hello</code> → <code>helo</code>（l を打ち忘れ）</p>
          <div id="del-list" class="weakness-list"></div>
        </div>

        <!-- 挿入ミス -->
        <div class="weakness-section">
          <p class="weakness-section-title label">挿入ミス</p>
          <p class="weakness-section-desc">余計なキーを打ってしまうミス</p>
          <p class="weakness-example">例: <code>hello</code> → <code>he<span class="ex-wrong">e</span>llo</code>（余計な e が入った）</p>
          <div id="ins-list" class="weakness-list"></div>
        </div>

      </div>

      <div class="result-actions">
        <a href="index.html" class="btn btn-secondary">テストに戻る</a>
        <a href="practice.html" class="btn btn-primary">この弱点を練習する</a>
      </div>
    </div>
  </div>

</div>
<script src="weakness.js"></script>
</body>
</html>
