<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ユーザー登録')}"></head>
<body class="min-h-screen flex flex-col">
    <!-- ヘッダー -->
    <header th:replace="~{fragments/layout :: header('')}"></header>

    <main class="flex-1 max-w-5xl mx-auto w-full p-4 md:p-8 flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">新規ユーザー登録</h2>
            
            <!-- JSで操作するエラーメッセージ表示領域 -->
            <div id="js-error-message" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg mb-6 border border-red-200 text-center font-medium">
            </div>

            <!-- API通信を行うため、th:action や method 属性は不要です -->
            <form id="register-form" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">ユーザー名</label>
                    <input type="text" id="username" name="username" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500" required autofocus />
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
                    <input type="email" id="email" name="email" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500" required />
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
                    <input type="password" id="password" name="password" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500" required minlength="4" />
                </div>
                <div>
                    <label for="passwordConfirm" class="block text-sm font-medium text-gray-700 mb-1">パスワード（確認用）</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500" required minlength="4" />
                </div>
                
                <div class="pt-4">
                    <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow transition-colors flex justify-center items-center">
                        登録する
                    </button>
                </div>
            </form>
            
            <div class="mt-6 text-center text-sm">
                <a th:href="@{/login}" class="text-blue-600 hover:underline">すでにアカウントをお持ちの方はこちら</a>
            </div>
        </div>
    </main>

    <!-- 共通API処理（CSRF含む）と、この画面用のJSを読み込み -->
    <script src="/js/common.js"></script>
    <script src="/js/register.js"></script>
</body>
</html>
