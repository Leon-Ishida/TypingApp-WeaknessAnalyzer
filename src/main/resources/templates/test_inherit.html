<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ゲスト結果の保存')}"></head>
<body class="min-h-screen flex flex-col">
    <header th:replace="~{fragments/layout :: header('')}"></header>

    <main class="flex-1 max-w-4xl mx-auto w-full p-4 md:p-8">
        <section class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-6 md:p-8 border-b border-gray-100">
                <p class="text-sm font-semibold text-blue-600 mb-2">ログインが完了しました</p>
                <h2 class="text-2xl font-bold text-gray-900">ゲスト結果をアカウントに保存</h2>
                <p class="mt-3 text-sm leading-6 text-gray-600">
                    ゲストとして実行したテスト結果のうち、アカウントに保存する結果を選択してください。
                </p>
            </div>

            <div id="inherit-loading" class="p-10 text-center text-gray-500" role="status">
                <div class="inline-block h-7 w-7 animate-spin rounded-full border-2 border-gray-200 border-t-blue-600" aria-hidden="true"></div>
                <p class="mt-3 text-sm">保存できる結果を確認しています…</p>
            </div>

            <div id="inherit-error" class="hidden p-6 md:p-8" role="alert">
                <div class="rounded-lg border border-red-200 bg-red-50 p-4">
                    <p class="font-semibold text-red-700">結果を読み込めませんでした</p>
                    <p id="inherit-error-message" class="mt-1 text-sm text-red-600">時間をおいて、もう一度お試しください。</p>
                    <button id="btn-retry-inherit" type="button" class="mt-4 rounded-lg border border-red-300 bg-white px-4 py-2 text-sm font-medium text-red-700 hover:bg-red-100">
                        再読み込み
                    </button>
                </div>
            </div>

            <div id="inherit-empty" class="hidden p-10 text-center">
                <h3 class="text-lg font-semibold text-gray-800">保存できるゲスト結果はありません</h3>
                <p class="mt-2 text-sm text-gray-500">結果が期限切れか、すでにアカウントへ保存されている可能性があります。</p>
                <a th:href="@{/}" class="mt-6 inline-block rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">
                    テスト画面へ戻る
                </a>
            </div>

            <div id="inherit-content" class="hidden">
                <div class="flex flex-col gap-3 border-b border-gray-100 bg-gray-50 px-6 py-4 sm:flex-row sm:items-center sm:justify-between">
                    <label class="inline-flex cursor-pointer items-center gap-3 text-sm font-medium text-gray-700">
                        <input id="inherit-select-all" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" checked />
                        すべて選択
                    </label>
                    <p id="inherit-selection-summary" class="text-sm text-gray-500" aria-live="polite"></p>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full min-w-[640px] text-left text-sm">
                        <thead class="border-b border-gray-100 bg-white text-gray-600">
                            <tr>
                                <th class="w-16 px-6 py-3 font-medium"><span class="sr-only">選択</span></th>
                                <th class="px-4 py-3 font-medium">実行日時</th>
                                <th class="px-4 py-3 text-right font-medium">WPM</th>
                                <th class="px-6 py-3 text-right font-medium">正答率</th>
                            </tr>
                        </thead>
                        <tbody id="inherit-results-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>

                <div class="border-t border-amber-100 bg-amber-50 px-6 py-4 text-sm leading-6 text-amber-800">
                    選択しなかった結果はアカウントに保存されず、期限経過後に削除されます。
                    「保存しない」を選んだ場合も、結果はすぐには削除されません。
                </div>

                <div class="flex flex-col-reverse gap-3 p-6 sm:flex-row sm:justify-end">
                    <button id="btn-decline-inherit" type="button" class="rounded-lg border border-gray-300 bg-white px-5 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50">
                        保存しない
                    </button>
                    <button id="btn-save-inherit" type="button" class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-blue-300">
                        選択した結果を保存
                    </button>
                </div>
            </div>

            <div id="inherit-complete" class="hidden p-10 text-center" role="status" aria-live="polite">
                <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-green-100 text-2xl text-green-600" aria-hidden="true">✓</div>
                <h3 id="inherit-complete-title" class="mt-4 text-lg font-semibold text-gray-900"></h3>
                <p id="inherit-complete-message" class="mt-2 text-sm text-gray-500"></p>
                <a th:href="@{/}" class="mt-6 inline-block rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">
                    テスト画面へ戻る
                </a>
            </div>
        </section>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/test_inherit.js"></script>
</body>
</html>
